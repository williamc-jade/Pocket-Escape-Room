<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Pocket Escape</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=IM+Fell+English+SC&family=Figtree:wght@400;500;700&family=JetBrains+Mono:wght@500;700&family=Special+Elite&display=swap">
<style>
/* Layout: full-bleed AR camera view, thin HUD rail on top, sheets rising from the bottom. Single dark look over a live camera feed. */
:root{
  --ink:#0e0c14; --ink-2:#18151f; --line:#2f2a3a;
  --paper:#f3e9d6; --muted:#a99fb3;
  --accent:#f08a24;       /* pumpkin */
  --accent-dim:#8a4f18;
  --ghost:#8ff0c8;        /* ghost-light green, success */
  --red:#e2483d; --green:#3fbf6a; --blue:#3f8cf0;
  --f-display:"Creepster","IM Fell English SC",Georgia,serif;
  --f-serif:"IM Fell English SC","Iowan Old Style",Georgia,serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-type:"Special Elite","Courier New",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--paper);font:15px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;display:block;z-index:1}
#camfeed{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;background:#000}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}

#overlay{position:fixed;inset:0;pointer-events:none;z-index:5}
#overlay > *{pointer-events:auto}
#overlay.shake{animation:shake2 .4s 2}
@keyframes shake2{10%,50%,90%{transform:translate(-10px,6px)}30%,70%{transform:translate(10px,-6px)}}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:8px;pointer-events:none}
#hud > *{pointer-events:auto}
.chip{background:rgba(14,12,20,.74);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(240,138,36,.3);border-radius:999px;padding:7px 12px;display:flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px}
#timer{font-family:var(--f-mono);letter-spacing:.04em}
body.bomb #timerChip{border-color:rgba(226,72,61,.6)}
body.bomb #timer{color:var(--red);font-weight:700;font-size:15px}
body.urgent #timerChip{animation:urgent .5s steps(2) infinite}
@keyframes urgent{50%{background:rgba(226,72,61,.45)}}
#hud .spacer{flex:1}
.iconbtn{width:38px;height:38px;justify-content:center;padding:0}
.chip b{color:var(--accent)}

#objective{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 58px);max-width:min(92vw,440px);text-align:center;font-size:13px;background:rgba(14,12,20,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:7px 14px;border-radius:10px;pointer-events:none;text-wrap:balance}
#objective b{color:var(--accent);font-weight:600}
#guide{position:absolute;left:0;top:0;width:46px;height:46px;margin:-23px 0 0 -23px;pointer-events:none}
#guide svg{width:100%;height:100%;filter:drop-shadow(0 0 8px rgba(240,138,36,.75))}
#dist{position:absolute;pointer-events:none;font:700 12px var(--f-mono);color:var(--accent);background:rgba(14,12,20,.7);padding:2px 7px;border-radius:6px;transform:translate(-50%,-50%)}
#examine{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translateX(-50%);background:var(--accent);color:#1d0f02;font-weight:700;padding:15px 30px;border-radius:999px;box-shadow:0 8px 30px rgba(240,138,36,.45);white-space:nowrap;animation:pulse 1.6s ease-in-out infinite}
body.preview #examine{bottom:calc(env(safe-area-inset-bottom,0px) + 150px)}
#examine.isBomb{background:var(--red);color:#fff;box-shadow:0 8px 30px rgba(226,72,61,.5)}
@keyframes pulse{50%{box-shadow:0 8px 44px rgba(240,138,36,.85)}}
#toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);transform:translateX(-50%);background:rgba(14,12,20,.9);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;width:max-content;max-width:min(90vw,420px);text-align:center;pointer-events:none;transition:opacity .3s}
body.preview #toast{bottom:calc(env(safe-area-inset-bottom,0px) + 220px)}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0}
#flash.scare{background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.85) 0%,rgba(120,255,170,.6) 40%,rgba(0,0,0,.9) 100%);animation:fl .9s cubic-bezier(.1,.7,.3,1)}
#flash.boom{background:radial-gradient(circle,#fff 0%,#ffd27a 30%,#e2483d 65%,#200 100%);animation:fl 2.2s ease-out}
#flash.win{background:radial-gradient(circle,rgba(255,190,110,.6),rgba(0,0,0,0) 70%);animation:fl 1.4s ease-out}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
#whisper{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font:400 clamp(52px,17vw,104px)/1 var(--f-display);color:var(--accent);letter-spacing:.06em;text-shadow:0 0 30px rgba(240,138,36,.8);opacity:0}
#whisper.on{animation:whisper 1.6s ease-out forwards}
@keyframes whisper{0%{opacity:1;transform:scale(1.15)}60%{opacity:.9}100%{opacity:0;transform:scale(1)}}
#stick{position:absolute;left:max(24px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:110px;height:110px;border-radius:50%;border:1px solid rgba(240,138,36,.35);background:rgba(14,12,20,.45);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:rgba(240,138,36,.8)}
#previewTag{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 30px);font-size:12px;color:var(--muted);text-align:right;max-width:180px;pointer-events:none}

/* Sheets */
.scrim{position:absolute;inset:0;z-index:10;background:rgba(6,4,10,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:90%;overflow:auto;background:var(--ink-2);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding-block:20px calc(env(safe-area-inset-bottom,0px) + 18px);padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));animation:rise .32s cubic-bezier(.2,.9,.3,1.1);touch-action:pan-y}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.sheet h2{font:400 32px/1.05 var(--f-serif);margin:4px 0 8px;text-wrap:balance}
.sheet p{margin:0 0 12px;color:var(--muted)}
.sheet p em{color:var(--paper);font-style:normal}
.ask{font-size:13px;color:var(--paper);text-align:center;margin:0 0 6px;font-weight:600}
.cipher{font:700 clamp(18px,5.5vw,26px)/1.4 var(--f-mono);letter-spacing:.1em;background:#120f18;border:1px dashed var(--accent-dim);border-radius:12px;padding:14px;text-align:center;word-break:break-word;margin:6px 0 14px}
.cipher.type{font:400 clamp(18px,5.4vw,24px)/1.45 var(--f-type);letter-spacing:.04em;background:#ece1c8;color:#2a2116;border:0;transform:rotate(-.6deg)}
.cipher small{display:block;font:500 11px var(--f-mono);letter-spacing:.06em;color:var(--muted);margin-top:10px}
.news{background:#e8e0cc;color:#211c14;border-radius:4px;padding:14px 16px;margin:6px 0 14px;font:15px/1.55 Georgia,serif;transform:rotate(.5deg)}
.news .mast{font:400 22px/1 var(--f-serif);text-align:center;border-bottom:2px solid #211c14;padding-bottom:6px;letter-spacing:.04em}
.news .date{font:11px var(--f-mono);text-align:center;margin:4px 0 8px;opacity:.7}
.news h4{font:700 20px/1.15 Georgia,serif;margin:0 0 6px;text-transform:uppercase;letter-spacing:.02em}
.rail{display:grid;gap:8px;margin:6px 0 14px}
.rail div{display:flex;align-items:center;gap:10px;background:#120f18;border:1px dashed var(--accent-dim);border-radius:10px;padding:10px 14px;font:700 24px var(--f-mono);letter-spacing:.3em}
.rail span{font:600 11px var(--f-body);letter-spacing:.1em;color:var(--muted);width:60px}
.zig{font:700 20px/1.2 var(--f-mono);display:grid;gap:2px;margin-top:6px;overflow-x:auto}
.zig div{display:flex;gap:4px}
.zig i{width:24px;text-align:center;font-style:normal}
.minikey{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.minikey span{font:500 12px var(--f-mono);background:#1c1824;border-radius:6px;padding:3px 8px;letter-spacing:.05em}
.answer{display:flex;gap:5px;justify-content:center;margin-bottom:12px;min-height:46px;flex-wrap:wrap}
.slot{width:clamp(24px,8vw,34px);height:46px;border-bottom:2px solid var(--accent-dim);font:700 22px/46px var(--f-mono);text-align:center;color:var(--accent)}
.slot.cur{border-color:var(--accent)}
.gap{width:12px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.keys{display:grid;grid-template-columns:repeat(9,1fr);gap:5px}
.keys button{height:42px;border-radius:8px;background:#26212f;font:600 15px var(--f-mono)}
.keys button:active{background:var(--accent);color:#1d0f02}
.keys .wide{grid-column:span 2}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{flex:1;min-width:100px;padding:13px 14px;border-radius:12px;background:#26212f;font-weight:600;text-align:center}
.btn.primary{background:var(--accent);color:#1d0f02}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.ready{border-color:var(--ghost);color:var(--ghost)}
.hintbox{margin-top:12px;padding:12px 14px;border-radius:12px;background:#120f18;border-left:3px solid var(--ghost);font-size:14px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;font:12px var(--f-mono);margin-top:6px}
.tbl td{padding:2px 4px;text-align:center;min-width:18px}
.solvedline{color:var(--ghost)!important}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:0 auto}
.pad button{height:54px;border-radius:12px;background:#26212f;font:700 22px var(--f-mono)}
.pad button:active{background:var(--accent);color:#1d0f02}
.wirebox{position:relative;background:#0b0a10;border:1px solid var(--line);border-radius:14px;height:260px;margin:4px 0 6px;touch-action:none;user-select:none;-webkit-user-select:none}
.wirebox svg{position:absolute;inset:0;width:100%;height:100%}
.wirebox .status{position:absolute;left:0;right:0;bottom:8px;text-align:center;font:600 11px var(--f-mono);letter-spacing:.14em;color:var(--muted)}
.simon{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:300px;margin:4px auto 6px}
.simon button{aspect-ratio:1.4;border-radius:16px;opacity:.45;transition:opacity .08s,transform .08s;max-width:100%}
.simon button.lit{opacity:1;transform:scale(.96);box-shadow:0 0 30px currentColor}
.simonmsg{text-align:center;font:600 12px var(--f-mono);letter-spacing:.12em;color:var(--muted);margin:6px 0}
.wirecut{display:flex;flex-direction:column;gap:10px;margin:8px 0}
.wirecut button{height:56px;border-radius:12px;display:flex;align-items:center;gap:12px;padding:0 16px;background:#1f1b27;border:2px solid transparent;font-weight:700}
.wirecut button .w{flex:1;height:10px;border-radius:5px}
.wirecut button[aria-pressed="true"]{border-color:var(--paper)}
.invite{background:#efe3c6;color:#2b1d12;border-radius:6px;padding:22px 20px;font:16px/1.6 var(--f-type);text-align:center;border:6px double #6b4a2a;margin:6px 0 10px}
.invite h3{font:400 30px/1 var(--f-display);color:#4a2a60;margin:0 0 10px;letter-spacing:.03em}
.invite .red{color:#c2261b;font-weight:700}
.invite .sig{margin-top:10px;font-style:italic}

/* start */
#start{position:absolute;inset:0;overflow:auto;touch-action:pan-y;background:radial-gradient(120% 70% at 50% 0%,#3a1d0c 0%,var(--ink) 62%);padding-block:calc(env(safe-area-inset-top,0px) + 28px) calc(env(safe-area-inset-bottom,0px) + 28px);padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
#start .inner{max-width:460px;margin:0 auto;width:100%}
#start h1{font:400 clamp(44px,13vw,64px)/.95 var(--f-display);margin:6px 0 18px;letter-spacing:.02em;text-wrap:balance}
#start h1 span{color:var(--accent)}
.rooms{display:grid;gap:10px;margin-bottom:6px}
.room{text-align:left;padding:16px;border-radius:16px;background:#17141e;border:1.5px solid var(--line);display:grid;gap:4px}
.room[aria-pressed="true"]{border-color:var(--accent);background:#21160d}
.room.bombroom[aria-pressed="true"]{border-color:var(--red);background:#22120f}
.room h3{margin:0;font:400 24px/1.1 var(--f-serif)}
.room p{margin:0;color:var(--muted);font-size:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tags span{font:500 11px var(--f-mono);padding:3px 7px;border:1px solid var(--line);border-radius:6px;color:var(--muted)}
.field{margin-bottom:18px}
.field label{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.seg{display:flex;background:#17141e;border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{flex:1;padding:10px 6px;border-radius:9px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#1d0f02;font-weight:700}
.stack{display:flex;flex-direction:column;gap:10px}
.note{font-size:13px;color:var(--muted);margin-top:14px}
.note.warn{color:#f0b26a}
.linkbtn{color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:14px;padding:6px 0}
.stat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.stat b{font-family:var(--f-mono);color:var(--accent)}
.notes li{margin-bottom:8px;color:var(--paper)}
.big{font-size:44px!important}
.pslot{flex:1;min-width:0;max-width:150px;min-height:46px;border:1.5px dashed var(--accent-dim);border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;color:var(--accent);padding:6px}
.pslot.cur{border-color:var(--accent)}
.itemgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.itemgrid button{padding:12px 10px;border-radius:10px;background:#26212f;font-weight:600;font-size:14px}
.itemgrid button:active{background:var(--accent);color:#1d0f02}
.bagsec{margin:18px 0 0}
.bagsec h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
.words{display:flex;flex-wrap:wrap;gap:8px}
.word{font:700 15px var(--f-mono);background:#26212f;border:1px solid var(--accent-dim);color:var(--accent);padding:6px 10px;border-radius:8px}
.word.ghostw{border-color:var(--ghost);color:var(--ghost)}
.word small{display:block;font:500 10px var(--f-body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.cline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.cline .lbl{font-size:12px;color:var(--muted)}
.cline .ct{font:500 13px var(--f-mono);color:var(--paper);word-break:break-word}
.cline .ans{grid-row:1/3;grid-column:2;align-self:center;font:700 14px var(--f-mono);color:var(--ghost)}
.itemlist{display:flex;flex-wrap:wrap;gap:8px}
.itemlist span{background:#26212f;border-radius:999px;padding:6px 12px;font-size:13px}
.storylog p{color:var(--paper);margin:0 0 10px;padding-left:12px;border-left:2px solid var(--line)}
details.inv summary{cursor:pointer;color:var(--accent);font-weight:600;padding:6px 0}
.empty{color:var(--muted);font-size:14px}
.qrs{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:8px 0}
.qr{background:#17141e;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;min-width:0}
.qr .code{background:#fff;border-radius:8px;padding:8px;display:inline-block;max-width:100%}
.qr .code svg,.qr .code img{display:block;width:160px;height:160px;max-width:100%}
.qr h4{margin:10px 0 4px;font:400 18px var(--f-serif)}
.qr .url{font:11px var(--f-mono);color:var(--muted);word-break:break-all}
#invitedBanner{background:#21160d;border:1px solid var(--accent-dim);border-radius:14px;padding:14px 16px;margin-bottom:18px}
#invitedBanner h3{margin:0 0 4px;font:400 26px/1.1 var(--f-serif)}
#invitedBanner p{margin:0;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<video id="camfeed" playsinline muted autoplay hidden></video>
<div id="overlay">
  <div id="hud" hidden>
    <div class="chip" id="timerChip"><span id="timer">00:00</span></div>
    <div class="chip" id="progChip"><span id="progLbl">Clue</span> <b id="prog">1/11</b></div>
    <button class="chip" id="bagChip" aria-label="Open your bag"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f08a24" stroke-width="2"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Bag <b id="bagCount">1</b></button>
    <button class="chip" id="notesChip" hidden>Notes <b id="notesCount">0</b></button>
    <div class="spacer"></div>
    <button class="chip iconbtn" id="muteBtn" aria-label="Mute sound"><svg id="sndOn" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg><svg id="sndOff" hidden width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg></button>
    <button class="chip iconbtn" id="menuBtn" aria-label="Menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
  <div id="objective" hidden></div>
  <div id="guide" hidden><svg viewBox="0 0 48 48"><path d="M14 10 L38 24 L14 38 L20 24 Z" fill="#f08a24"/></svg></div>
  <div id="dist" hidden></div>
  <button id="examine" hidden>Examine</button>
  <div id="toast" hidden></div>
  <div id="stick" hidden><div id="knob"></div></div>
  <div id="previewTag" hidden>Preview mode. Drag to look, use the stick (or WASD) to walk.</div>
  <div id="flash"></div>
  <div id="whisper"></div>
  <div id="panel" class="scrim" hidden><div class="sheet" id="panelBody"></div></div>

  <div id="start">
    <div class="inner">
      <div class="eyebrow">Augmented reality escape rooms</div>
      <h1>Pocket <span>Escape</span></h1>
      <div id="invitedBanner" hidden></div>
      <div class="field" id="pickField"><label>Choose a room</label>
        <div class="rooms" id="roomPick">
          <button class="room" data-s="house" aria-pressed="true">
            <h3>The House on Hollow Lane</h3>
            <p>A house that only appears on Halloween night. You got an invitation. The door locks behind you.</p>
            <div class="tags"><span>16 clues</span><span>~25 min</span><span>Ages 7+</span><span>No timer</span></div>
          </button>
          <button class="room bombroom" data-s="bomb" aria-pressed="false">
            <h3>Five Minutes</h3>
            <p>A bomb, three wires, five minutes. The clues around you say which one to cut. It changes every game.</p>
            <div class="tags"><span>4 clues</span><span>5:00 timer</span><span>Ages 10+</span></div>
          </button>
        </div>
      </div>
      <div class="field">
        <label>Difficulty</label>
        <div class="seg" id="modeSeg">
          <button data-m="easy" aria-pressed="true">Easy</button>
          <button data-m="hard" aria-pressed="false">Hard</button>
        </div>
        <p class="note" id="modeNote" style="margin:8px 0 0">One clue at a time, with hints and arrows to guide you.</p>
      </div>
      <div class="field">
        <label>Room size</label>
        <div class="seg" id="roomSeg">
          <button data-r="1.4" aria-pressed="false">Small</button>

function hideCapitals(text,word){ const t=[...text.toLowerCase()]; let prev=-1; const n=word.length;

    const left=need.filter(i=>!state.solved.includes(i)).length;
    if(left) return openPanel(`<div class="eyebrow">Locked</div><h2>${d.name}</h2><p>${d.lockedMsg||"It won't budge yet."}</p>${d.requires==="all"?`<p><em>${left} thing${left>1?"s":""} left to find in the house.</em></p>`:""}<div class="row"><button class="btn primary" id="ok">Step back</button></div>`,b=>b.querySelector("#ok").onclick=closePanel); }
  const H=ROOM.hard; const hints=H?[]:hintsFor(d); let hl=0;
  const typed=["shift","atbash","morse","riddle","number","backwards","capitals","rail"].includes(d.type);
  let mid=displayFor(d);
  if(typed) mid+=`${d.ask&&!H?`<div class="ask">${d.ask}</div>`:""}<div class="answer" id="ans"></div><div class="keys" id="kb"></div>`;

    <div class="row">${hints.length?'<button class="btn ghost" id="hintBtn">Hint</button>':""}${d.type==="simon"?'<button class="btn primary" id="watch">Watch</button>':""}<button class="btn ghost" id="close">Step back</button></div>`, body=>{

    const done=()=>{ clearTimeout(hintTimer); d.final?winHouse(it):solveStation(it); };
    if(typed) letterEntry(body,d,done);

function mountPick(body,d,done){
  const pool=["Place card","Newspaper clipping","Brass bell","Recipe page","Mirror shard","Rusty key"]; let chosen=[];
  const ans=body.querySelector("#pans"),grid=body.querySelector("#pgrid");
  const draw=()=>{ ans.innerHTML=[0,1,2].map(i=>`<div class="pslot ${i===chosen.length?"cur":""}">${chosen[i]||(i+1)}</div>`).join("");
    grid.innerHTML=pool.map(n=>`<button data-n="${n}" ${chosen.includes(n)?"disabled":""}>${n}</button>`).join(""); };
  grid.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b||b.disabled)return; sfx.spark(); tone(220+chosen.length*110,.3,0,"sine",.15,90); chosen.push(b.dataset.n); draw();
    if(chosen.length===3){ if(chosen.every((c,i)=>c===d.order[i])) setTimeout(done,350); else setTimeout(()=>{ wrongFx(ans); noise(.5,0,.25,"lowpass",600,100); chosen=[]; draw(); },350); } });
  draw();
}
function mountWires(body,done){
  const box=body.querySelector("#wb"),svg=body.querySelector("#wsvg"),stat=body.querySelector("#wstat");
  const cols=["#e2483d","#3f8cf0","#f2c94c","#e46bb4"]; const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
  const L=shuffle([0,1,2,3]),R=shuffle([0,1,2,3]); const linked=new Set(); let drag=null;
  const W=()=>box.clientWidth,H=()=>box.clientHeight; const yAt=i=>28+i*((H()-70)/3);
  function draw(){ const w=W(); let s="";
    for(let i=0;i<4;i++){ s+=`<rect x="0" y="${yAt(i)-9}" width="38" height="18" rx="3" fill="${cols[L[i]]}"/><rect x="${w-38}" y="${yAt(i)-9}" width="38" height="18" rx="3" fill="${cols[R[i]]}"/>`;
      s+=`<circle cx="44" cy="${yAt(i)}" r="9" fill="#2f2a3a" stroke="${cols[L[i]]}" stroke-width="3"/><circle cx="${w-44}" cy="${yAt(i)}" r="9" fill="#2f2a3a" stroke="${cols[R[i]]}" stroke-width="3"/>`; }
    for(const c of linked){ const a=L.indexOf(c),b=R.indexOf(c); s+=`<line x1="44" y1="${yAt(a)}" x2="${w-44}" y2="${yAt(b)}" stroke="${cols[c]}" stroke-width="12" stroke-linecap="round"/>`; }
    if(drag) s+=`<line x1="44" y1="${yAt(drag.i)}" x2="${drag.x}" y2="${drag.y}" stroke="${cols[L[drag.i]]}" stroke-width="12" stroke-linecap="round"/>`;
    svg.innerHTML=s; stat.textContent=`${linked.size} / 4 CONNECTED`; }
  const pos=e=>{ const r=box.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };
  box.addEventListener("pointerdown",e=>{ const p=pos(e); if(p.x>90)return; let best=-1,bd=40; for(let i=0;i<4;i++){ const dd=Math.abs(p.y-yAt(i)); if(dd<bd&&!linked.has(L[i])){bd=dd;best=i;} }
    if(best<0)return; drag={i:best,...p}; box.setPointerCapture(e.pointerId); sfx.spark(); draw(); });
  box.addEventListener("pointermove",e=>{ if(!drag)return; Object.assign(drag,pos(e)); draw(); });
  box.addEventListener("pointerup",e=>{ if(!drag)return; const p=pos(e); let hit=-1; if(p.x>W()-90){ let bd=40; for(let j=0;j<4;j++){ const dd=Math.abs(p.y-yAt(j)); if(dd<bd){bd=dd;hit=j;} } }
    if(hit>=0&&R[hit]===L[drag.i]){ linked.add(L[drag.i]); sfx.zap(); if(navigator.vibrate)navigator.vibrate(15); } else if(hit>=0) sfx.wrong();
    drag=null; draw(); if(linked.size===4) setTimeout(done,400); });
  requestAnimationFrame(draw);
}
function mountSimon(body,done){
  const btns=[...body.querySelectorAll("#simon button")],msg=body.querySelector("#smsg"),notes=[392,523,659,784];
  const seq=Array.from({length:5},()=>Math.floor(Math.random()*4)); let round=3,pos=0,locked=true;
  const flash=(i,d=.32)=>{ btns[i].classList.add("lit"); tone(notes[i],d,0,"triangle",.15); setTimeout(()=>btns[i].classList.remove("lit"),d*1000); };
  function play(){ locked=true; pos=0; msg.textContent="WATCH"; seq.slice(0,round).forEach((n,k)=>setTimeout(()=>flash(n),400+k*520)); setTimeout(()=>{locked=false;msg.textContent=`YOUR TURN · ROUND ${round-2} OF 3`},400+round*520); }
  body.querySelector("#watch").onclick=play;
  btns.forEach(b=>b.addEventListener("click",()=>{ if(locked)return; const i=+b.dataset.i; flash(i,.2);
    if(i!==seq[pos]){ locked=true; wrongFx(body.querySelector("#simon")); msg.textContent="OOPS. WATCH AGAIN"; setTimeout(play,900); return; }
    pos++; if(pos===round){ if(round===5){ locked=true; msg.textContent="PERFECT"; setTimeout(done,500); } else { round++; locked=true; msg.textContent="GOOD"; setTimeout(play,700); } } }));
}
function solveStation(it){
  const d=it.def; sfx.solve(); burst(it.anchor.position,0x8ff0c8,60); if(navigator.vibrate)navigator.vibrate([20,60,20]);
  if(it.model.userData.unlock){ it.model.userData.unlock(); sfx.unlock(); }
  state.solved.push(it.i); if(ROOM.sequential) state.step++; renderBag();
  if(d.info){ state.notes.push(d.after); renderNotes(); }
  if(d.bonus){ state.remaining+=d.bonus; lastSec=-1; }
  persist();
  openPanel(`<div class="eyebrow">Solved</div><h2>${d.answer||"Done!"}</h2><p class="solvedline">${d.after}</p><div class="row"><button class="btn primary" id="go">Keep going</button></div>`,
    b=>b.querySelector("#go").onclick=()=>{ closePanel(); objective(); });
}
function openBomb(it){
  let pick=null;
  openPanel(`<div class="eyebrow" style="color:var(--red)">${fmt(Math.ceil(state.remaining))} left</div><h2>${it.def.name}</h2><p>${it.def.lead}</p>
    ${state.notes.length?`<ul class="notes">${state.notes.map(n=>`<li>${n}</li>`).join("")}</ul>`:`<p style="color:#f0b26a">You haven't found any clues yet. Cutting now is a guess.</p>`}
    <div class="wirecut" id="wc">${[["RED","var(--red)"],["GREEN","var(--green)"],["BLUE","var(--blue)"]].map(([n,c])=>`<button data-w="${n}" aria-pressed="false"><span>${n[0]+n.slice(1).toLowerCase()}</span><span class="w" style="background:${c}"></span></button>`).join("")}</div>
    <div class="row"><button class="btn ghost" id="close">Step back</button><button class="btn" id="cut" disabled style="background:var(--red);color:#fff">Cut wire</button></div>`, body=>{
    body.querySelector("#close").onclick=closePanel;
    body.querySelectorAll("#wc button").forEach(b=>b.onclick=()=>{ pick=b.dataset.w; sfx.key(); body.querySelectorAll("#wc button").forEach(x=>x.setAttribute("aria-pressed",x===b)); const c=body.querySelector("#cut"); c.disabled=false; c.textContent=`Cut the ${pick.toLowerCase()} wire`; });
    body.querySelector("#cut").onclick=()=>{ sfx.snip(); const w=it.model.userData.wires[pick]; if(w)w.visible=false; burst(it.anchor.position,0xffd27a,20,.6); closePanel();

/* halfway through the bomb: a radio tip names a wrong wire the player doesn't already know about */
function halfHint(){ state.halfHint=true; const known=state.notes.join(" ");
  const w=ROOM.wrong.find(c=>!known.includes(c))||ROOM.wrong[0];
  const msg=`Radio crackle: <em>"Bomb squad here. Whatever you do, do NOT cut the ${w} wire."</em>`;
  if(!state.notes.some(n=>n.includes("Bomb squad"))) state.notes.push(`Bomb squad: the ${w} wire is NOT the one.`); renderNotes(); renderBag();
  noise(1.2,0,.18,"bandpass",1800,900,2); [0,.25].forEach(t=>tone(1400,.08,t,"square",.06)); if(navigator.vibrate)navigator.vibrate([60,60,60]);

function begin(mode,resume){
  audio();
  if(resume&&saved&&saved.seed) Object.assign(state,{step:saved.step,solved:saved.solved||[],hints:saved.hints,elapsed:saved.elapsed,radius:saved.radius,seed:saved.seed,hard:!!saved.hard});
  else { state.seed=(Math.random()*2**31)|0||1; resume=false; }
  ROOM=state.scenario==="bomb"?bombRoom(state.seed,state.hard):houseRoom(state.seed,state.hard);
  if(ROOM.timer.mode==="down") state.remaining=ROOM.timer.seconds;
  state.mode=mode; state.running=true; buildItems();
  const isB=ROOM.id==="bomb"; document.body.classList.toggle("bomb",isB);
  $("#progChip").hidden=isB; $("#notesChip").hidden=true; renderNotes(); renderBag();
  $("#start").hidden=true; $("#hud").hidden=false; objective();
  const prev=mode==="preview"; document.body.classList.toggle("preview",prev); $("#stick").hidden=!prev; $("#previewTag").hidden=!prev; roomShell.visible=prev;
  scene.background=prev?new THREE.Color(0x0e0c14):null; if(prev){ camera.position.set(0,0,0); look.yaw=0; look.pitch=0; }
  if(mode==="cam") setTimeout(()=>toast("Turn to look around. Take real steps to walk toward a <b style='color:#f08a24'>?</b>",5000),isB?3400:0);
  if(isB) toast("The clock is running. Find the clues before you cut.");
  else if(resume) toast(state.hard?"Welcome back.":"Welcome back. Follow the glowing <b style='color:#f08a24'>?</b>");
  else showInvite(true);
}
async function startAR(resume){
  let session=null;
  let xrFailed=false; try{ xrFailed=sessionStorage.getItem("xrFailed")==="1"; }catch(e){}
  if(xrOK&&!xrFailed){ const cfgs=[{requiredFeatures:["local"],optionalFeatures:["dom-overlay"],domOverlay:{root:$("#overlay")}},{optionalFeatures:["local","dom-overlay"],domOverlay:{root:$("#overlay")}}];
    for(const c of cfgs){ try{ session=await navigator.xr.requestSession("immersive-ar",c); break; }catch(e){ session=null; } }
    if(session&&!session.domOverlayState){ try{ await session.end(); }catch(e){} session=null; } }
  if(!session){ try{ sessionStorage.setItem("xrFailed","1"); }catch(e){} return startCamMode(resume); }
  try{ xrSession=session; renderer.xr.setReferenceSpaceType("local"); await renderer.xr.setSession(session); }
  catch(e){ try{ renderer.xr.setReferenceSpaceType("viewer"); await renderer.xr.setSession(session); }catch(e2){ try{session.end()}catch(e3){} xrSession=null; return startCamMode(resume); } }
  $("#overlay").addEventListener("beforexrselect",e=>e.preventDefault());
  session.addEventListener("end",()=>{ xrSession=null; persist(); location.reload(); });
  begin("ar",resume);
}
let xrOK=false;
(async function boot(){
  try{ await document.fonts.ready; await Promise.all(['110px Creepster','34px "IM Fell English SC"','700 64px "JetBrains Mono"','600 40px Figtree'].map(f=>document.fonts.load(f))); }catch(e){}
  initThree(); setupPreviewControls(); roomShell.visible=true; scene.background=new THREE.Color(0x0e0c14);
  try{ xrOK=!!(navigator.xr&&await navigator.xr.isSessionSupported("immersive-ar")); }catch(e){}
  const camOK=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
  if(!xrOK&&!camOK){ const b=$("#arBtn"); b.disabled=true; b.textContent="Camera not available here"; $("#arNote").className="note warn"; $("#arNote").textContent="This browser can't open the camera. Open the game link in Chrome or Safari on a phone. You can still try the preview."; }
  $("#arBtn").onclick=()=>startAR(false); $("#continueBtn").onclick=()=>startAR(true); $("#previewBtn").onclick=()=>begin("preview",false);
})();
</script>
